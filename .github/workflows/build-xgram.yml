name: Build XGram Desktop (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-xgram.yml"

permissions:
  contents: read

env:
  REPOSITORY_NAME: tdesktop
  SOURCE_REPOSITORY: s25xmu-ai/tdesktop
  SOURCE_REF: dev
  APP_NAME: XGram

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare build directories
        run: |
          if not exist "%USERPROFILE%\TBuild" mkdir "%USERPROFILE%\TBuild"
          if not exist "%USERPROFILE%\TBuild\Libraries" mkdir "%USERPROFILE%\TBuild\Libraries"
          if exist "%GITHUB_WORKSPACE%\TBuild" rmdir "%GITHUB_WORKSPACE%\TBuild"
          mklink /D "%GITHUB_WORKSPACE%\TBuild" "%USERPROFILE%\TBuild"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>"%GITHUB_ENV%"
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>"%GITHUB_ENV%"

      - name: Checkout XGram Desktop source
        uses: actions/checkout@v7
        with:
          repository: s25xmu-ai/tdesktop
          ref: dev
          submodules: recursive
          path: TBuild/tdesktop
          fetch-depth: 0

      - name: Read Windows SDK and prepare cache key
        shell: bash
        run: |
          set -e
          DOCPATH="$GITHUB_WORKSPACE/TBuild/tdesktop/docs/building-win.md"
          if [ ! -f "$DOCPATH" ]; then
            echo "::error::docs/building-win.md was not found in the checked-out repository."
            exit 1
          fi
          SDK="$(grep -m1 "SDK version" "$DOCPATH" | sed -E 's/.*\*\*([^*]+)\*\* SDK version.*/\1/')"
          if [ -z "$SDK" ] || [ "$SDK" = "$DOCPATH" ]; then
            echo "::error::Could not read the Windows SDK version from docs/building-win.md."
            exit 1
          fi
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          sha256sum "$GITHUB_WORKSPACE/TBuild/tdesktop/Telegram/build/prepare/prepare.py" | awk '{print $1}' > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          git -C "$GITHUB_WORKSPACE/TBuild/tdesktop" rev-parse HEAD >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Initialize MSVC x64 environment
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: Configure NuGet
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json
          if errorlevel 1 exit /b 0

      - name: Cache third-party sources
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-x64-third-party-

      - name: Cache prebuilt libraries
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-x64-libs-

      - name: Prepare third-party libraries
        run: |
          call "%TBUILD%\tdesktop\Telegram\build\prepare\win.bat" skip-release silent
          if errorlevel 1 exit /b %errorlevel%

      - name: Select Telegram API credentials
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "TDESKTOP_API_FLAGS=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> "$GITHUB_ENV"
          else
            echo "TDESKTOP_API_FLAGS=-D TDESKTOP_API_TEST=ON" >> "$GITHUB_ENV"
            echo "::warning::API secrets are not configured; this build will use test API credentials and may not be suitable for normal use."
          fi

      - name: Configure and build Release x64
        run: |
          cd /D "%TBUILD%\tdesktop\Telegram"
          call configure.bat x64 %TDESKTOP_API_FLAGS% -D CMAKE_CONFIGURATION_TYPES=Release -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -Wno-dev
          if errorlevel 1 exit /b %errorlevel%
          cmake --build ..\out --config Release --parallel
          if errorlevel 1 exit /b %errorlevel%

      - name: Collect XGram executable
        run: |
          if not exist "%TBUILD%\tdesktop\out\Release\Telegram.exe" (
            echo ERROR: Telegram.exe was not found in the Release output folder.
            exit /b 1
          )
          if not exist artifact mkdir artifact
          copy /Y "%TBUILD%\tdesktop\out\Release\Telegram.exe" "artifact\XGram.exe"
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: XGram-Desktop-Windows-x64-Release
          path: artifact/XGram.exe
          if-no-files-found: error
          retention-days: 7
