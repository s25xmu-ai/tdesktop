name: Build XGram Desktop (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-xgram.yml"

permissions:
  contents: read

env:
  REPOSITORY_NAME: tdesktop
  SOURCE_REPOSITORY: s25xmu-ai/tdesktop
  SOURCE_REF: dev
  APP_NAME: XGram

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare build directories
        run: |
          if not exist "%USERPROFILE%\TBuild" mkdir "%USERPROFILE%\TBuild"
          if not exist "%USERPROFILE%\TBuild\Libraries" mkdir "%USERPROFILE%\TBuild\Libraries"
          if exist "%GITHUB_WORKSPACE%\TBuild" rmdir "%GITHUB_WORKSPACE%\TBuild"
          mklink /D "%GITHUB_WORKSPACE%\TBuild" "%USERPROFILE%\TBuild"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>"%GITHUB_ENV%"
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>"%GITHUB_ENV%"

      - name: Checkout XGram Desktop source
        uses: actions/checkout@v7
        with:
          repository: s25xmu-ai/tdesktop
          ref: dev
          submodules: recursive
          path: TBuild/tdesktop
          fetch-depth: 0

      - name: Fix MSYS2 diffutils package name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prepare = Join-Path $env:GITHUB_WORKSPACE "TBuild\tdesktop\Telegram\build\prepare\prepare.py"
          if (!(Test-Path -LiteralPath $prepare)) {
            throw "prepare.py not found at $prepare"
          }
          $source = Get-Content -Raw -LiteralPath $prepare
          $old = "mingw-w64-x86_64-diffutils"
          $count = ([regex]::Matches($source, [regex]::Escape($old))).Count
          if ($count -ne 1) {
            throw "Expected exactly one '$old' occurrence in prepare.py, found $count. Refusing to patch silently."
          }
          $source = $source.Replace($old, "diffutils")
          Set-Content -LiteralPath $prepare -Value $source -NoNewline
          Write-Host "Patched prepare.py to install the MSYS2 diffutils package."

      - name: Read Windows SDK and prepare cache key
        shell: bash
        run: |
          set -e
          DOCPATH="$GITHUB_WORKSPACE/TBuild/tdesktop/docs/building-win.md"
          if [ ! -f "$DOCPATH" ]; then
            echo "::error::docs/building-win.md was not found in the checked-out repository."
            exit 1
          fi
          SDK="$(grep -m1 "SDK version" "$DOCPATH" | sed -E 's/.*\*\*([^*]+)\*\* SDK version.*/\1/')"
          if [ -z "$SDK" ] || [ "$SDK" = "$DOCPATH" ]; then
            echo "::error::Could not read the Windows SDK version from docs/building-win.md."
            exit 1
          fi
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          sha256sum "$GITHUB_WORKSPACE/TBuild/tdesktop/Telegram/build/prepare/prepare.py" | awk '{print $1}' > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          git -C "$GITHUB_WORKSPACE/TBuild/tdesktop" rev-parse HEAD >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Initialize MSVC x64 environment
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: Configure NuGet
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json
          if errorlevel 1 exit /b 0

      - name: Cache third-party sources
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-x64-third-party-

      - name: Cache prebuilt libraries
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-x64-libs-

      - name: Ensure Visual Studio ATL/MFC headers are installed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found; cannot locate Visual Studio Installer."
          }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (!$vsPath) {
            throw "No Visual Studio installation found."
          }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if (!(Test-Path $installer)) {
            throw "Visual Studio setup.exe not found at $installer"
          }
          & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) {
            throw "Visual Studio ATL/MFC component installation failed with exit code $LASTEXITCODE"
          }
          Write-Host "ATL/MFC components installed for $vsPath"

      - name: Prepare third-party libraries
        run: |
          if not exist logs mkdir logs
          rem Remove a potentially partial MSYS2 install restored from cache.
          if exist "%TBUILD%\ThirdParty\msys64" rmdir /S /Q "%TBUILD%\ThirdParty\msys64"
          if exist "%TBUILD%\ThirdParty\msys64.exe" del /F /Q "%TBUILD%\ThirdParty\msys64.exe"
          call "%TBUILD%\tdesktop\Telegram\build\prepare\win.bat" silent > logs\prepare.log 2>&1
          if errorlevel 1 (
            echo First preparation attempt failed. Cleaning MSYS2 and retrying once...>>logs\prepare.log
            if exist "%TBUILD%\ThirdParty\msys64" rmdir /S /Q "%TBUILD%\ThirdParty\msys64"
            if exist "%TBUILD%\ThirdParty\msys64.exe" del /F /Q "%TBUILD%\ThirdParty\msys64.exe"
            call "%TBUILD%\tdesktop\Telegram\build\prepare\win.bat" silent >> logs\prepare.log 2>&1
            if errorlevel 1 (
              type logs\prepare.log
              exit /b 1
            )
          )
          type logs\prepare.log

      - name: Select Telegram API credentials
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "TDESKTOP_API_FLAGS=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> "$GITHUB_ENV"
          else
            echo "TDESKTOP_API_FLAGS=-D TDESKTOP_API_TEST=ON" >> "$GITHUB_ENV"
            echo "::warning::API secrets are not configured; this build will use test API credentials and may not be suitable for normal use."
          fi

      - name: Configure and build Release x64
        run: |
          if not exist "%GITHUB_WORKSPACE%\logs" mkdir "%GITHUB_WORKSPACE%\logs"
          cd /D "%TBUILD%\tdesktop\Telegram"
          call configure.bat x64 %TDESKTOP_API_FLAGS% -D CMAKE_CONFIGURATION_TYPES=Release -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -Wno-dev > "%GITHUB_WORKSPACE%\logs\configure.log" 2>&1
          if errorlevel 1 (
            type "%GITHUB_WORKSPACE%\logs\configure.log"
            exit /b 1
          )
          type "%GITHUB_WORKSPACE%\logs\configure.log"
          cmake --build ..\out --config Release --parallel > "%GITHUB_WORKSPACE%\logs\build.log" 2>&1
          if errorlevel 1 (
            type "%GITHUB_WORKSPACE%\logs\build.log"
            exit /b 1
          )
          type "%GITHUB_WORKSPACE%\logs\build.log"

      - name: Collect XGram executable
        run: |
          if not exist "%TBUILD%\tdesktop\out\Release\Telegram.exe" (
            echo ERROR: Telegram.exe was not found in the Release output folder.
            exit /b 1
          )
          if not exist artifact mkdir artifact
          copy /Y "%TBUILD%\tdesktop\out\Release\Telegram.exe" "artifact\XGram.exe"
          if errorlevel 1 exit /b %errorlevel%

      - name: Zip build logs
        if: always()
        shell: pwsh
        run: |
          $logDir = Join-Path $env:GITHUB_WORKSPACE "logs"
          if (!(Test-Path $logDir)) {
            New-Item -ItemType Directory -Path $logDir | Out-Null
          }
          $logFiles = Get-ChildItem -Path $logDir -File -ErrorAction SilentlyContinue
          if ($logFiles) {
            Compress-Archive -Path (Join-Path $logDir "*") -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "XGram-build-logs.zip") -Force
          } else {
            "No step logs were produced. Open the failed step in GitHub Actions for its output." | Set-Content (Join-Path $logDir "README.txt")
            Compress-Archive -Path (Join-Path $logDir "*") -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "XGram-build-logs.zip") -Force
          }

      - name: Upload build logs (including on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XGram-build-logs
          path: XGram-build-logs.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: XGram-Desktop-Windows-x64-Release
          path: artifact/XGram.exe
          if-no-files-found: error
          retention-days: 7
